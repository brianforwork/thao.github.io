<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title | escape }}</title>
</head>
<body>
  <header>
    <h1>{{ site.title | markdownify }}</h1>
  </header>
  <main>
    <img src="{{ site.logo }}" alt="Logo" style="display: block; margin: 0 auto; border-radius: 50%; width: 150px;">
    <div>{{ site.description | markdownify }}</div>
  </main>
</body>
</html>
